[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-agent-hub"
version = "0.1.0"
description = "Loopback SQLite broker core for supervised local agent tasks"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "mcp>=1,<2", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["hub*"]
